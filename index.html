<!DOCTYPE html>
<html>
<head>
    <title>Babi Cachos</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: Arial;
            background: #fff4f0;
            text-align: center;
            margin: 0;
        }

        header {
            background: #d46a6a;
            color: white;
            padding: 25px;
        }

        section {
            padding: 20px;
        }

        .card {
            background: white;
            margin: 15px auto;
            padding: 20px;
            width: 90%;
            max-width: 400px;
            border-radius: 12px;
            box-shadow: 0 0 15px #ddd;
        }

        select, input {
            width: 95%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button {
            background: #000;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 8px;
            width: 100%;
            margin-top: 10px;
            font-size: 16px;
        }

        button:hover {
            background: #333;
        }

        .pix {
            margin-top: 25px;
            background: #e7ffe7;
            padding: 20px;
            border-radius: 12px;
        }

        footer {
            margin-top: 30px;
            padding: 15px;
            background: #f1f1f1;
            font-size: 14px;
        }
    </style>
</head>
<body>

<header>
    <h1>Babi Cachos</h1>
    <p>Especialista em cabelos cacheados</p>
</header>

<section>

<div class="card">
    <h2>Agendar Horário</h2>

    <select id="servico">
        <option value="Corte para Cachos - R$150">Corte para Cachos - R$150</option>
        <option value="Cronograma Capilar - R$120">Cronograma Capilar - R$120</option>
        <option value="Reconstrução - R$180">Reconstrução - R$180</option>
    </select>

    <input type="date" id="data" required>
    <input type="time" id="hora" required>

    <button type="button" onclick="agendar()">Agendar via WhatsApp</button>
</div>

<div class="pix">
    <h3>Pagamento do Sinal via Pix</h3>
    <p><strong>Chave Pix (Email):</strong></p>
    <p style="font-size:18px;"><strong>matheusfernandesgm90@gmail.com</strong></p>
    <p>Valor do sinal: 30% do serviço escolhido</p>
</div>

</section>

<footer>
    © 2026 Babi Cachos - Todos os direitos reservados
</footer>

<script>
function agendar() {
    var servico = document.getElementById("servico").value;
    var data = document.getElementById("data").value;
    var hora = document.getElementById("hora").value;

    if(data === "" || hora === ""){
        alert("Por favor, escolha a data e o horário.");
        return;
    }

    var mensagem = "Olá! Quero agendar:%0A%0A" +
                   "Serviço: " + servico + "%0A" +
                   "Data: " + data + "%0A" +
                   "Horário: " + hora + "%0A%0A" +
                   "Já vou realizar o pagamento do sinal via Pix.";

    var numero = "5513997133746";

    var link = "https://api.whatsapp.com/send?phone=" + numero + "&text=" + mensagem;

    window.location.href = link;
}
</script>

</body>
</html>
